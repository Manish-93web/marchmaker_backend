name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @marchmaker/shared build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # A high or critical advisory in a production dependency fails the build.
      - run: pnpm audit --prod --audit-level=high

  docker:
    needs: verify
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/api/Dockerfile -t marchmaker-api:${{ github.sha }} .
      - run: docker build -f apps/worker/Dockerfile -t marchmaker-worker:${{ github.sha }} .
      # Deploy: staging on main, production on tag (platform step added in Phase 16).
