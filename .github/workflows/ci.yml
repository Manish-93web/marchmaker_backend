name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @marchmaker/shared build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # A high or critical advisory in a production dependency fails the build.
      - run: pnpm audit --prod --audit-level=high

  docker:
    needs: verify
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "tag=${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}
          docker build -f apps/api/Dockerfile -t $IMAGE/api:${{ steps.meta.outputs.tag }} .
          docker build -f apps/worker/Dockerfile -t $IMAGE/worker:${{ steps.meta.outputs.tag }} .
          docker push $IMAGE/api:${{ steps.meta.outputs.tag }}
          docker push $IMAGE/worker:${{ steps.meta.outputs.tag }}

  # Staging on every push to main; production on a version tag, behind the environment's required reviewers.
  # Needs these secrets per environment (Settings > Environments):
  #   MONGODB_URI  - the target database, used for the migration step
  #   DEPLOY_HOOK_URL - the host's redeploy webhook (Render / Coolify / Portainer / your own), called with the new image tag
  deploy:
    needs: docker
    runs-on: ubuntu-latest
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @marchmaker/api...
      - name: Run schema migrations and create indexes
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          pnpm --filter @marchmaker/shared build
          pnpm --filter @marchmaker/api migrate:up
          pnpm --filter @marchmaker/api sync-indexes
      - name: Roll out the new images
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
          TAG: ${{ needs.docker.outputs.tag }}
        run: |
          test -n "$DEPLOY_HOOK_URL" || { echo "DEPLOY_HOOK_URL is not set for this environment"; exit 1; }
          curl --fail --silent --show-error -X POST "$DEPLOY_HOOK_URL" -H 'Content-Type: application/json' -d "{\"tag\":\"$TAG\"}"
      - name: Wait for the API to report healthy
        env:
          HEALTH_URL: ${{ vars.HEALTH_URL }}
        run: |
          test -n "$HEALTH_URL" || exit 0
          for i in $(seq 1 30); do curl --fail --silent "$HEALTH_URL" && exit 0; sleep 10; done
          echo "API did not become healthy"; exit 1
